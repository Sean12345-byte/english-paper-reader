const sections=[{"title":"Direct-to-Cell: A First Look into Starlink’s Direct Satellite-to-Device Radio Access Network through Crowdsourced Measurements","level":1,"paragraphs":["Jorge Garcia-Cabeza, Javier Albert-Smet, Zoraida Frias, Luis Mendo, Santiago Andrés Azcoitia, and Eduardo Yraola"]},{"title":"Abstract","level":4,"paragraphs":["Low Earth Orbit (LEO) satellite mega-constellations have emerged as a viable access solution for broadband connectivity in underserved areas. In 2024, Starlink, in partnership with T-Mobile, began beta testing an SMS-only Supplemental Coverage from Space (SCS) service. This marks the first large-scale deployment of Direct Satellite-to-Device (DS2D) communications, allowing unmodified smartphones to connect directly to spaceborne base stations. This article presents the first measurement study of deployed DS2D technologies. Using crowdsourced mobile network data from the U.S. between October 2024 and July 2025, we provide evidence-based insights into the capabilities, limitations, and future evolution of DS2D technologies for extending mobile connectivity. We find a strong correlation between the number of satellites deployed, the number of unique cell identifiers measured, and the volume of measurements, concentrated in accessible areas with poor terrestrial network coverage, such as national parks and sparsely populated counties. Stable physical-layer measurements were observed throughout the period, with a 24-dB lower median RSRP and a 3-dB higher RSRQ compared to terrestrial networks, reflecting the SMS-only usage of the DS2D network during this period. Based on the SINR measurements collected, we estimate the expected performance of the announced DS2D mobile data service to be around 3 Mb/s per beam in outdoor conditions. We also discuss strategies to expand this capacity up to 18 Mb/s in the future, depending on key regulatory and business decisions, including allowable out-of-band emissions, permitted number of satellites, and availability of spectrum and orbital resources."]},{"title":"Introduction","level":2,"paragraphs":["In recent years, particularly from 2020, Low Earth Orbit (LEO) mega-constellations have become a viable and increasingly widespread Non-Terrestrial Network (NTN) Internet access solution for fixed broadband services. Networks like SpaceX’s Starlink, Eutelsat’s OneWeb or Amazon’s Kuiper are successfully addressing longstanding limitations of traditional geostationary satellite communications. By operating at significantly lower altitudes (500-1200 km), these constellations offer latency levels comparable to those of terrestrial networks (typically tens of milliseconds vs. the hundreds associated with geostationary satellites), supporting real-time applications such as video conferencing and online gaming [1].","Following technological developments in fixed broadband connectivity, satellite-based cellular communications, known as Direct Satellite-to-Device (DS2D), have become a promising solution to provide seamless connectivity directly to standard unmodified smartphones. Starlink, the satellite communications division of SpaceX, has emerged as the global leader in DS2D communications by rapidly deploying a non-3GPPNTN-compliant solution that leverages terrestrial International Mobile Telecommunications (IMT) spectrum. In partnership with T-Mobile and using its spectrum, Starlink has been the first company to launch large-scale beta testing of a Supplemental Coverage from Space (SCS) service. The system is initially limited to Short Message Service (SMS), with support for voice and data services planned by late 2025.","In this article, we examine Starlink’s SCS services and characterize its DS2D network - referred to by Starlink as Direct-to-Cell. Using a large-scale dataset provided by the company Weplan Analytics comprising millions of crowdsourced measurements collected from October 2024 to July 2025,our analysis provides valuable insights into the implications of DS2D network design for mobile network planning and spectrum policy. The main contributions of this work are:","- The first measurement-based study of a commercially operating DS2D network, encompassing both spatial and temporal dimensions.","- A large-scale empirical evaluation of physical-layer Radio Access Network (RAN) parameters of Starlink’s DS2D network, namely Reference Signal Received Power (RSRP), Reference Signal Received Quality (RSRQ) and Signal-to-Interference-plus-Noise Ratio (SINR).","- An assessment of the projected performance of Starlink’s future SCS data services and strategies for network capacity expansion.","The remainder of this article is structured as follows. We first provide background on the evolution of LEO satellite networks and summarize related research. Secondly, we describe the dataset and our analytical approach. We then present and discuss the results. Finally, we offer conclusions and suggest future research."]},{"title":"BackGround","level":2,"paragraphs":[]},{"title":"Technological Evolution and Emerging Ecosystem","level":2,"paragraphs":["LEO satellite communications have progressed considerably in recent decades, driven by satellite miniaturization, improved launch capabilities, and the growing demand for ubiquitous connectivity. Early LEO constellations in the late 1990s were primarily designed to deliver voice and low-speed data services to remote and underserved areas. A new phase in LEO communications emerged in the late 2010s with the advent of mega-constellations [2]. Initiatives such as SpaceX’s Starlink and OneWeb began deploying extensive LEO satellite networks to provide broadband Internet access globally.","DS2D has been further enabled by significant progress in electronics, embedded systems, digital signal processing, and beamforming technologies, among others [3]. Specifically, DS2D connectivity relies on the satellites being equipped with advanced phased array antennas, highly sensitive radio receivers, and high-power transmitters. Moreover, compensation for Doppler shift and delay is essential to overcome the physical constraints of mobile-to-satellite links, and software-defined radio (SDR) is necessary to adapt the system to varying frequencies and technologies.","3GPP specifications have recently incorporated NTN in Release 17. Protocols have been enhanced to address the distinctive characteristics of satellite-based communications, such as the larger propagation distance between user terminals and satellites, which impacts procedures including hybrid automatic repeat request (HARQ) and random access. In addition, system information blocks have been extended to convey satellite-specific parameters, such as orbital position. Subsequent releases introduce further enhancements, focusing on improved coverage (potentially extending to indoor environments), support for neighbor cell measurements, and reduced battery consumption.","Starlink has pioneered DS2D deployments with a strategy focused on a dense LEO constellation at the lowest feasible orbital altitudes (currently primarily \\~ 550 km and selectively \\~ 350 km subject to coordination with NASA). In contrast, its main competitor, AST SpaceMobile, relies on a less dense constellation at higher altitudes (\\~ 700 km), supported by very large antenna arrays. Although both operators have so far relied primarily on IMT spectrum obtained through agreements with mobile network operators in different countries, they are now pursuing their own terrestrial and satellite spectrum. Other actors in the emerging DS2D ecosystem include Lynk Global, Skylo, and Viasat-Inmarsat. Key use cases comprise ubiquitous connectivity for IoT, supplementary coverage for terrestrial mobile networks, SOS alerts, emergency communications, and maritime and aeronautical connectivity."]},{"title":"Starlink’s Direct Satellite-to-Device Approach","level":2,"paragraphs":["Starlink has reshaped the satellite telecommunication sector by deploying over 7,000 satellites since its first launches in 2019. The bent-pipe architecture initially adopted [4] enabled rapid deployment using simpler satellite designs at the cost of deploying a dense network of ground stations to ensure continuous coverage. From 2022 onward, Starlink progressively introduced laser inter-satellite links (ISL), fully adopted in its second-generation (“Gen2”) fleet, enabling onboard signal processing and space-based routing. This transition from a ground-dependent relay to a space-based mesh brings expanded coverage, improved resilience, and enhanced end-to-end performance [1].","Rather than awaiting the completion of 3GPP standardization of NTN, Starlink pursued an early deployment strategy by integrating conventional LTE eNodeB payloads into its satellites, complemented with proprietary adaptations for NTN operation. This allows smartphones to connect natively using terrestrial mobile standards, while traffic is handled either through the company’s ground station network or, when necessary, routed across the constellation via ISLs [5].","SpaceX announced the completion of its first DS2D constellation in December 2024, consisting of approximately 400 satellites - barely 6% of their deployed fleet. In addition to the SCS service provided in the U.S. through the partnership with T-Mobile, the constellation also offers SCS connectivity in New Zealand and Australia via a partnership with operators and is under testing with operators in several other countries.","In November 2024, the FCC granted partial approval for Starlink’s DS2D operations to initiate the SMS-only beta testing, but imposed several conditions to prevent harmful interference with terrestrial and satellite incumbents, including the requirement to stop transmission immediately upon any substantiated claim of interference, limitations on power flux density levels for aggregate out-ofband emissions (OOBE), and mandatory coordination procedures with incumbents. ^{1}$ Subsequently, in March 2025, the FCC approved ^{2}$ a conditional waiver allowing Starlink to increase its OOBE by 9.4 dB, despite formal objections from terrestrial operators, including AT&T and Verizon, and EchoStar. The waiver stipulated that Starlink must continue to adhere to strict OOBE limits and engage in active interference resolution with affected parties.","In the U.S., Starlink’s DS2D beta operations have relied exclusively on the PCS G Block, a 2 $\\times 5 \\mathrm{MHz}$ channel at 1910-1915 MHz (uplink) and 1990-1995 MHz (downlink), which is part of the IMT spectrum licensed to T-Mobile across the contiguous United States. ^{3}$ In September 2025, having concluded the beta phase, Starlink acquired Mobile Satellite Service (MSS) spectrum rights from Echostar in the AWS-4 band (20002020 MHz uplink, 2180-2200 MHz downlink, 2 $\\times 20 \\mathrm{MHz})$ and IMT PCS H Block (1915-1920 MHz uplink, 1995-2000 MHz downlink, $2 \\times 5$ MHz). These additional allocations significantly expand the spectrum available for its Direct-toCell operations, particularly since the AWS-4 band overlaps with the 5G NR NTN band n252."]},{"title":"Related Work","level":2,"paragraphs":["Mirroring the rapid pace of innovation of LEO satellite communication technologies, a growing body of research has emerged from multiple perspectives to explore the design, deployment, and operation of these systems. Early studies focused primarily on the technologies that underpin LEO broadband services, addressing alternative network architectures (e.g., bent-pipe versus ISL designs), hybrid beamforming strategies, interference coordination mechanisms, and resource management challenges [2]. Although much of this work was initially centered on fixed satellite broadband services, recent attention has shifted toward DS2D communications [6], which is reflected in dedicated research and publication initiatives. ^{4}$ Alongside theoretical and architectural advances, new simulation tools, such as Hypatia and StarPerf, have been developed to support realistic modeling, design, and performance evaluation of LEO satellite networks under operational conditions.","Following initial deployments and the establishment of operational networks, a growing number of measurement studies have emerged, focusing on Starlink’s fixed satellite broadband services [1, 7-9]. These studies have primarily evaluated connectivity delivered through dedicated fixed user terminals (i.e., satellite “dishes”), with particular attention to metrics such as throughput and latency, a major historical limitation of traditional geostationary satellite systems.","Despite growing research on LEO satellite networks, to the best of our knowledge, there are no empirical evaluations of commercial DS2D deployments. This article presents the first measurement-based analysis of a real-world DS2D network, using large-scale crowdsourced mobile data collected during the beta testing phase of Starlink’s service in the U.S."]},{"title":"Methodology","level":2,"paragraphs":["In this study, we adopt a data-driven, user-centric methodology based on large-scale crowdsourced mobile measurements. Crowdsourced measurements offer a unique vantage point for evaluating cellular network performance, capturing realworld user experience even in sparsely populated areas [10]. The dataset is provided by the crowdsourcing company Weplan Analytics, whose data collection framework is specifically designed to capture and evaluate RAN performance. While the raw crowdsourced measurements are proprietary and cannot be shared, the derived statistics and analytical procedures are fully described in this article to enable methodological reproducibility. We first describe the data sources and the data preprocessing; then we present how we estimate the potential share of SCS services; and lastly we detail how we calculate the expected performance of DS2D communications based on SINR measurements."]},{"title":"Data Sources","level":2,"paragraphs":["Our primary data source consists of LTE crowdsourced measurements passively collected from Android user devices between October 2024 and July 2025. All data were anonymized at collection time by the crowdsourcing provider to ensure full compliance with applicable data protection regulations. We used the following network variables:","1. RAN parameters RSRP, RSRQ, SINR, EARFCN, ECI (E-UTRAN Cell Identifier) as defined in 3GPP specifications [11],","2. PLMN (Public Land Mobile Network) identifier, comprising Mobile Country Code (MCC) and Mobile Network Code (MNC). We filter with MCC = 310 and MNC = 830 or 210 for Starlink measurements, and MNC = 260 for T-Mobile’s terrestrial network measurements, which we compare with Starlink’s.","In addition, we incorporate three complementary data sources that help assess the consistency and reliability of the crowdsourced dataset. First, we compiled a dataset tracking the evolution of the cumulative number of Starlink’s DS2D-capable satellites in orbit by aggregating information from official SpaceX mission reports, which we publish openly as supplementary material [12]. Second, we used the publicly available T-Mobile coverage map to evaluate how well the spatial distribution of DS2D measurements aligns with areas designated as lacking terrestrial coverage. Finally, we used official open-data vector files for U.S. counties and national parks to quantify the SCS share, as detailed next, and official county-level population data from the U.S. Census Bureau to study the correlation of SCS share and population density."]},{"title":"Measuring SCS Share","level":2,"paragraphs":["To estimate the likelihood of relying on Starlink SCS services in a particular geographic area, we define a spatial indicator called SCS share. This metric quantifies the relative prevalence of Starlink DS2D connectivity in our dataset by computing the ratio of Starlink DS2D measurements to the total number of measurements observed (i.e., Starlink DS2D and T-Mobile terrestrial network measurements across all technologies and frequency bands). It thus indicates the degree to which Starlink serves as the primary mobile coverage provider in a given area."]},{"title":"Estimating DS2D Performance","level":2,"paragraphs":["To assess the performance of future DS2D data services, we use the modified Shannon formula for LTE introduced in [13] to estimate the downlink spectral efficiency of the system, $\\eta(\\mathrm{bps} / \\mathrm{Hz}$ per beam). This formula, for the case of no spatial multiplexing, is $\\eta=\\min \\left\\{s\\right.$ a $\\log _{2}(1+\\operatorname{SINR} / b)$, $m\\}$, where $s$ is a bandwidth efficiency factor, which accounts for all system overhead including guard bands, pilot symbols and signaling channels; $a, b$ are fitting coefficients, which model implementation-related losses; and $m$ is a limit imposed by the highest modulation and coding scheme (MCS) that the system can use. The terms $s$ and $m$ can be computed theoretically, whereas a, $b$ are adjusted from simulation. We consider a static (no fading)channel model with AWGN and no spatial multiplexing. In these conditions, [13] gives the values $s=0.57, a=0.9, b=1.25$. The parameter $m$ depends on the specific technology used by the LTE network. The highest supported MCS can be 64-, 256- or 1024-QAM, with a coding rate close to 1. As a reference, we use 256-QAM, for which the best channel-quality indicator (CQI) that the mobile terminal can report corresponds to 7.41 information bits per symbol [14, Table 7.2.3-2]. Taking into account the efficiency factor s, which already incorporates the effect of the cyclic prefix (as well as other types of overhead), this yields $m=$ 4.22 bps/Hz. Thus, the expression for spectral efficiency results in: $\\eta=\\min \\left\\{0.51 \\log _{2}(1+\\operatorname{SINR} / 1.25)\\right.$, 4.22\\}. Following [13], the spectral efficiency is computed for each SINR value, and then averaged over the SINR distribution."]},{"title":"Results","level":2,"paragraphs":["This section presents our empirical findings. We start by assessing the relationship between the observed number of cell identifiers and the satellites in orbit. We then examine the spatial availability of Starlink’s SCS service, characterizing the evolution of its geographic footprint, and quantifying its SCS share across different types of areas. Following that, we analyze key RAN performance indicators, including RSRP, RSRQ, and SINR. Lastly, based on these metrics, we estimate the expected capacity of DS2D data services, and discuss and quantify alternatives to improve it."]},{"title":"Network Expansion vs. Constellation Deployment","level":2,"paragraphs":["Figure 1 shows the evolution of the number of cumulative unique cell identifiers (ECIs) associated with Starlink’s DS2D network, as observed in our dataset over the measurement period. The results reveal a steady upward trend, closely correlated with the timeline of Gen2 satellite launches. This finding suggests that crowdsourcing may serve as a useful tool for large-scale characterization of DS2D networks, and challenges the common perception that such data are inherently biased toward urban areas. On the contrary, our results demonstrate that crowdsourced measurements offer valuable insights in sparsely populated regions, which lack robust terrestrial coverage and are precisely where SCS services are expected to make the greatest impact."]},{"title":"Starlink’s DS2D Spatial Analysis","level":2,"paragraphs":["Although satellite constellations are designed to provide global coverage by definition, the potential use of SCS services is not geographically uniform. In practice, DS2D observability varies significantly across regions, influenced by factors such as terrestrial network availability, operator deployment strategies, population density, and accessibility.","Figure 2 shows the evolution of the spatial distribution of Starlink’s DS2D mobile crowdsourced measurements. Initial measurements in late 2024 were concentrated in southeastern states affected by hurricanes, where the service temporarily substituted inoperative terrestrial networks, with a comparable pattern observed during the January 2025 Southern California wildfires. Following the official beta launch in early 2025, measurements expanded nationwide, and by March-April 2025, adoption had intensified considerably. The measurements further suggest that service activation during the initial phases was geographically constrained until the constellation reached completion, as early activity was limited to specific regions.","In Fig. 3, we present a logarithmic-scale heatmap showing the number of observed Starlink DS2D measurements overlaid on T-Mobile’s public coverage map. The comparison offers several noteworthy insights. First, DS2D measurements are concentrated primarily in areas designated by T-Mobile as having satellite-only coverage, with some also appearing in areas nominally served by terrestrial networks, suggesting potential reliability issues. Second, most DS2D measurements are concentrated in accessible yet underserved regions near populated zones, particularly around national parks.","A quantitative analysis using the SCS share indicator (as defined earlier) confirms that large national parks such as Death Valley and Yellowstone exhibit high reliance on DS2D, with values of 0.86 and 0.80 , respectively. Figure 4 plots the SCS share against population density, computed at a county level. Counties such as Knott (KY). Florence (WI), and Martin (KY), also located near national parks, show SCS share values exceeding 0.85. Overall, we find a moderately strong negative logarithmic correlation with county-level population density (Pearson correlation coefficient: -0.57)."]},{"title":"Analysis of DS2D Key Performance Indicators","level":2,"paragraphs":["Over the past decade, mobile networks have become an essential means of accessing the Internet for billions of users worldwide. Despite a remarkable growth in mobile network coverage, significant portions of the global population remain underserved by terrestrial cellular infrastructure, particularly in remote, rural, and sparsely populated areas.","In this subsection, we present key metrics of Starlink’s DS2D RAN, namely RSRP, RSRQ and SINR. We examined the dataset for spatial patterns but","FIGURE 1. No. monthly unique ECI vs. No. operational satellites.","FIGURE 2. Spatio-temporal evolution of observed Starlink’s DS2D measurements from October 2024 to July 2025.","FIGURE 3. Starlink’s measurement counts vs. T-Mobile’s coverage. 1. Death Valley National Park, 2. Yellowstone National Park.","in Starlink’s DS2D network and T-Mobile terrestrial network. DS2D shows substantially lower and more homogeneous RSRP levels (median: -121 dBm vs. -97 dBm; interdecile range: 21 dB vs. 37 dB), reflecting larger propagation losses and uniform link geometry, as users are located at large but relatively similar distances from the base stations, predominantly with line-of-sight conditions. Despite limited bandwidth, RSRQ is more favorable in DS2D (median: -9 dB vs. -12 dB) owing to low network load and minimal interference, though this advantage may diminish as demand grows. The correlation between RSRP and RSRQ is stronger in DS2D (0.69 vs. 0.34), consistent with lower interference. SINR values are also lower in DS2D (median: 0 dB vs. 5 dB), underscoring its coverage-limited, low-load operation."]},{"title":"Performance Assessment of Future DS2D Services","level":2,"paragraphs":["Building on the previous observations, we evaluate the potential performance of future DS2D data services. For this, we apply the modified Shannon capacity formulation using the available bandwidth and SINR measurements of the last three months, to ensure that the results reflect a more stable operational state of the network. Based on the SINR distributions, the mean and median spectral efficiency values are 0.61 and 0.52 bps/Hz, respectively. Note that, given that high SINR values are rarely observed, this estimation is largely insensitive to the method used to compute $m$, and the influence of this parameter is negligible.","Since Starlink’s current DS2D operations are restricted to the PCS G Block $(2 \\times 5 \\mathrm{MHz})$, the derived spectral efficiency corresponds to an approximate downlink capacity of 3.1Mb/s per beam. This value should be regarded as an upperbound estimate of the average throughput per connection, corresponding to the scenario of a single user occupying the full bandwidth of the beam. While such speeds may be sufficient to provide basic connectivity in remote or underserved regions, they remain well below the average downlink rates offered by terrestrial networks. This gap highlights the complementary nature of DS2D services in their current phase, consistent with their role as an SCS solution.","Nevertheless, performance may improve in the coming months through several potential capacity expansion options, including:","1. Higher transmit power,","2. Reduced orbital altitude,","3. Expanded bandwidth, and","4. The continued growth of the satellite constellation.","First, as discussed earlier, we do not observe the 3.1-dB increase in the RAN metrics that would be expected from applying the FCC’s March 2025 authorization; instead, only a slight improvement is reflected in the mesurements. With the available evidence, it is not possible to determine whether this variation is attributable to the regulatory change. It therefore remains unclear whether transmissions are already occurring at the newly authorized power levels, although SpaceX’s filings suggest that this is the case (see footnote 4). Nevertheless, in the hypothetical assumption that the $9.4-\\mathrm{dB}$ relaxation in the OOBE limit allows for a future increase in transmit power, and assuming that the increase in SINR would be similar (cover-","FIGURE 6. CDF of physical-layer measurements for Starlink DSD and T-Mobile’s terrestrial networks.","age-limited network), we estimate that the spectral efficiency would increase from the current baseline to 0.89 bps/Hz (mean) and 0.83 bps/Hz (median), raising the estimated average per-beam capacity from $3.1 \\mathrm{Mb} / \\mathrm{s}$ to $4.5 \\mathrm{Mb} / \\mathrm{s}$.","Second, system performance may also be improved by lowering orbital altitudes. SpaceX has been authorized to selectively operate DS2D satellites in Very Low Earth Orbits (VLEO) at an altitude of 340-360 km, subject to previous coordination with NASA. ^{6}$ Assuming free-space propagation, relocating the entire constellation to lower altitudes would reduce path loss by $20 \\log _{10}(550 / 355) \\approx$ 3.8 dB . To comply with the OOBE constraints, this would require an estimated 1.3-dB reduction in transmit power, resulting in a net gain of about 2.5 dB in received signal power. Assuming again that the SINR values are increased in the same proportion, the spectral efficiency would raise from its baseline value to 0.83 bps/Hz (mean) and 0.76 bps/Hz (median). This corresponds to an approximate 1.4× gain, yielding an estimated downlink capacity of 4.2 Mb/s per beam.","Third, system throughput may be increased by expanding the available bandwidth. In September 2025, Starlink acquired spectrum from EchoStar in the MSS AWS-4 band (2000-2020 MHz uplink, 2180-2200 MHz downlink), and in the IMT PCS band (H Block, 1915-1920 MHz uplink, 1995-2000 MHz downlink), as discussed previously. This additional spectrum provides significantly more capacity than the $2 \\times 5 \\mathrm{MHz}$ PCS G Block currently used for DS2D.","Whereas the AWS-4 band has been standardized in 3GPP NTN as n252 and is expected to be integrated into smartphone chipsets in the future, the PCS H Block corresponds to existing IMT spectrum and can therefore be used immediately. Integrating the PCS H Block spectrum into the currently deployed infrastructure - which operates in the PCS G Block - would immediately double system capacity, increasing the per-beam estimate from 3.1 Mb/s to 6.2 Mb/s. In the medium term, once NTN bands are more widely supported in commercial devices, the additional 20 MHz downlink from AWS-4 could be exploited. Combined with the PCS allocations, this would increase per-beam capacity by a factor of six relative to the baseline, reaching about 18.6 Mb/s when using both Starlink’s spectrum holdings and T-Mobile’s PCS G Block.","Beyond the per-beam capacity expected, these acquisitions reduce Starlink’s reliance on third-party terrestrial operators for spectrum access. By leveraging their own PCS H Block spectrum, Starlink can provide a service comparable to that currently offered through T-Mobile’s spectrum, with the estimated per-beam throughput of 3.1 Mb/s. Furthermore, the aggregation of their full spectrum holdings in the AWS and PCS bands (totaling $2 \\times 25 \\mathrm{MHz}$ ) would enable an estimated per-beam throughput of $15.5 \\mathrm{Mb} / \\mathrm{s}$, thereby allowing the provision of DS2D services without reliance on third-party spectrum agreements. Note that these figures correspond to aggregate perbeam capacity rather than achievable single-user rates. Attaining the maximum values per connection would require device support for spectrum aggregation across these multiple bands, which is not yet included in current NTN standardization. Accordingly, the realistic upper bound for per-user capacity is expected to be around 12.4 Mb/s (estimated throughput over the AWS band only).","In the longer term, satellite swarm antenna arrays show promising preliminary results in increasing the directivity of satellite beams [15], which allows for higher gains and improved spatial multiplexing. Achieving this would require the launch and operation of many more satellites, which might also contribute to increasing the overall throughput of DS2D networks and the effective capacity experienced by end users. Although the FCC denied Starlink’s request to authorize 30,000 DS2D-capable satellites, the company remains authorized to operate up to 7,500 such satellites, indicating substantial potential for network densification. Furthermore, the aforementioned advancements in network capacity could be combined, potentially enabling greater per-beam throughput in the future."]},{"title":"Conclusions","level":2,"paragraphs":["In this article, we presented the first empirical analysis of a commercially deployed DS2D network, focusing on Starlink’s SCS Service in the U.S. in partnership with T-Mobile. Using largescale crowdsourced measurements between October 2024 and July 2025, we characterized the spatio-temporal evolution and RAN performance of the DS2D network, which only supported SMS during the observed period.","Our results confirm a strong correlation between the number of DS2D-capable satellites launched and the number of unique cell identifiers observed, as well as a spatial distribution of measurements consistent with the operator’s coverage gaps. We observe a significant number of measurements concentrated around areas that are relatively accessible yet underserved by terrestrial networks, such as national parks. Furthermore, we find significant negative correlation between the prevalence of Starlink measurements and population density, reflecting its role as a complementary solution in sparsely populated regions.","The measurements indicate slight increases in RSRP, RSRQ, and SINR throughout the beta test-","1ing period, which may be attributable to network changes, including the higher OOBE levels authorized by the FCC and the deployment of some satellites at VLEO altitudes. Based on the SINR measurements, we estimate the current average per-beam throughput to be approximately 3.1 Mb/s, which is sufficient for basic services but significantly below terrestrial averages. Looking ahead, per-beam throughput could increase to 4.2 Mb/s by using VLEO satellites (\\~350 km), and up to $4.5 \\mathrm{Mb} / \\mathrm{s}$ for LEO, assuming that OOBEs relaxation has not been applied yet. In the short term, recent spectrum acquisitions will enable doubling per-beam capacity (to $6.2 \\mathrm{Mb} / \\mathrm{s}$ ), with the potential to reach 18.6 Mb/s in the medium term once NTN bands are integrated into commercial smartphone modems. However, the extent to which these enhancements translate into higher per-user throughput will ultimately depend on the expansion of the satellite constellation and the evolution of service demand.","Our work illustrates the value of crowdsourced data to monitor emerging network technologies. Beyond characterizing deployment and performance, such data can help detect underserved zones, assess coverage gaps, and inform infrastructure planning, offering a promising tool for both technical and policy research on mobile communication systems. Future work will involve monitoring the evolution of DS2D networks and services, tracking the evolution of Starlink’s network as new services are introduced, and exploring other emerging DS2D deployments."]},{"title":"Acknowledgments","level":2,"paragraphs":["We would like to thank Dr. Tim Farrar for bringing one of the references to our attention, and Dr. Fadi Saibi for several corrections to an early version of the manuscript.","This work has been partially supported by Weplan Analytics through the CROWD-X project and by UPM’s Doctores Emergentes program (24-ED3B0Y-100-JOQZ29), funded by the Region of Madrid."]},{"title":"References","level":2,"paragraphs":["[1] N. Mohan et al., “A Multifaceted Look at Starlink Performance,” Proc. WWW’24, 2024, pp. 2723-34.[2] Y. Su et al., “Broadband LEO Satellite Communications: Architectures and Key Technologies,” IEEE Wireless Commun., vol. 26, no. 2, vol. 4,2019, pp. 55-61.[3] Starlink, “Direct to Cell: First Text Message Sent via Starlink Satellite,” https://www.starlink.com/public-files/DIRECT\\_TO\\_ CELL\\_FIRST\\_TEXT\\_UPDATE.pdf, 2024, accessed: May 2025.[4] S. Ma et al., “Network Characteristics of LEO Satellite Constellations: A Starlink-Based Measurement from End Users,” Proc. IEEE INFOCOM, 2023.[5] A. U. Chaudhry and H. Yanikomeroglu, “Laser Intersatellite Links in a Starlink Constellation: A Classification and Analysis,” IEEE Vehic. Tech. Mag., vol. 16, no. 2, vol. 6, 2021, pp. 48-56.[6] H. B. Pasandi et al., “A Survey on Direct-to-Device Satellite Communications: Advances, Challenges, and Prospects,” Proc. LEO Networking and Communication, 2024, pp. 7-12.[7] F. Michel et al., “A First Look at Starlink Performance,” Proc. IMC’22, 2022.[8] D. Laniewski, E. Lanfer, and N. Aschenbruck, “Measuring Mobile Starlink Performance: A Comprehensive Look,” IEEE Open J. Commun. Society, 2025.[9] D. Laniewski et al., “Starlink on the Road: A First Look at Mobile Starlink Performance in Central Europe,” Proc. TMA 2024, 2024.[10] Z. Frias, W. Lehr, and V. Stocker, “Building an Ecosystem for Mobile Broadband Measurement: Methods and Policy Challenges,” Telecommunications Policy, vol. 49, no. 5, vol. 6, 2025, p. 102905.[11] C. Johnson, Long Term Evolution in Bullets, 2nd ed., 2012.[12] J. Albert-Smet et al., “Starlink Direct-to-Cell Satellite Launches Per Date (from Official SpaceX Mission Reports),” 2025; https://dx.doi.org/10.21227/rknd-y219.[13] P. Mogensen et al., “LTE Capacity Compared to the Shannon Bound,” Vehic. Tech. Conf., Spring, 2007.[14] “Evolved Universal Terrestrial Radio Access (E-UTRA); Physical Layer Procedures (Release 17),” Third Generation Partnership Project, Technical Specification 3GPP TS 36.213 v17.1.0, May 2022.[15] D. Tuzi, T. Delamotte, and A. Knopp, “Satellite SwarmBased Antenna Arrays for 6G Direct-to-Cell Connectivity,” IEEE Access, vol. 11, 2023."]},{"title":"Biographies","level":2,"paragraphs":["Jorge Garcia-Cabeza (jorge.garcia@weplananalytics.com) is an Industrial Ph.D. candidate at Univ. Politécnica de Madrid (UPM) and Weplan Analytics. He holds MSc. degrees in Telecommunications Engineering and Data Science from UPM. His research focuses on network measurements to characterize wireless technologies and spectrum utilization using crowdsourced data as a diagnostic tool.","Javier Albert-Smet (javier.albert.smet@upm.es) is a Ph.D. candidate at UPM focusing on mobile network measurements. He holds an MSc. in Electrical Engineering from KTH, where he graduated with honors in 2022. His main research interests are AI & mobile network optimization, a field in which he co-authored two patents at Ericsson.","Zoraida Frias (zoraida.frias@upm.es) is an Associate Professor at UPM, where she earned her Ph.D. in Communications Technologies in 2016 (cum laude). Her work bridges engineering and policy, focusing on data-driven models for analyzing next-generation network deployments and their economic and regulatory dimensions, with a particular emphasis on spectrum.","Luis Mendo (luis.mendo@upm.es) is an Associate Professor at UPM. He received the Ph.D. degree (cum laude) in Telecommunication Engineering from UPM in 2001. He has coauthored four books, four patents, and over 40 papers in the area of mobile communications. His research interests include analysis and optimization of mobile networks, simulation methods, and statistical estimation.","Santiago Andrés Azcoitia (santiago.andres@upm.es) is an Assistant Professor at UPM. He received the Ph.D. in Telematics Engineering from Univ. Carlos III de Madrid in 2023 (cum laude), and worked for 25 years as an ICT strategy consultant. His research interests include telecommunication networks, digital economics, policy, regulations, and ethics.","Eduardo Yraola (eduardo.yraola@weplananalytics.com) is the Lead Data Scientist of Weplan Analytics. He received his Ph.D. in physics from Univ. Autónoma de Madrid in 2015, and has over 10 years of experience as a data scientist.","1. ^{6}$ See FCC’s DA 24-1193."]}];const translations={"Starlink has reshaped the satellite telecommunication sector by deploying over 7,000 satellites since its first launches in 2019.":"自2019年首次發射以來，Starlink已部署超過7,000顆衛星，重塑衛星通訊產業。","The bent-pipe architecture initially adopted [4] enabled rapid deployment using simpler satellite designs at the cost of deploying a dense network of ground stations to ensure continuous coverage.":"最初採用的透明轉發架構[4]，透過較簡單的衛星設計實現快速部署，但代價是必須建立密集的地面站網路以維持連續覆蓋。","From 2022 onward, Starlink progressively introduced laser inter-satellite links (ISL), fully adopted in its second-generation (“Gen2”) fleet, enabling onboard signal processing and space-based routing.":"自2022年起，Starlink逐步導入衛星間雷射鏈路（ISL），並在第二代（Gen2）衛星群全面採用，使衛星能進行星上訊號處理與太空路由。","This transition from a ground-dependent relay to a space-based mesh brings expanded coverage, improved resilience, and enhanced end-to-end performance [1].":"這項從依賴地面站的中繼架構轉向太空網狀網路的變革，擴大了覆蓋範圍、提升網路韌性，並改善端到端效能[1]。","Low Earth Orbit (LEO) satellite mega-constellations have emerged as a viable access solution for broadband connectivity in underserved areas.":"低地球軌道（LEO）大型衛星星座已成為服務不足地區提供寬頻連線的一種可行接入方案。","In 2024, Starlink, in partnership with T-Mobile, began beta testing an SMS-only Supplemental Coverage from Space (SCS) service.":"2024年，Starlink與T-Mobile合作，開始對僅支援簡訊的太空補充覆蓋（SCS）服務進行測試。","This marks the first large-scale deployment of Direct Satellite-to-Device (DS2D) communications, allowing unmodified smartphones to connect directly to spaceborne base stations.":"這是衛星直接連接終端設備（DS2D）通訊首次大規模部署，讓未經改裝的智慧型手機能直接連上太空中的基地臺。","This article presents the first measurement study of deployed DS2D technologies.":"本文首次針對已實際部署的DS2D技術進行量測研究。","Using crowdsourced mobile network data from the US between October 2024 and July 2025, we provide evidence-based insights into the capabilities, limitations, and future evolution of DS2D technologies for extending mobile connectivity.":"我們利用2024年10月至2025年7月在美國蒐集的群眾協作行動網路資料，以實證方式分析DS2D延伸行動連線的能力、限制與未來發展。","We find a strong correlation between the number of satellites deployed, the number of unique cell identifiers measured, and the volume of measurements, concentrated in accessible areas with poor terrestrial network coverage, such as national parks and sparsely populated counties.":"我們發現，部署衛星數量、量測到的不重複小區識別碼數量與量測資料量之間具有高度相關性；資料集中在可到達、但地面網路覆蓋不足的地區，例如國家公園及人口稀少的郡。","Stable physical-layer measurements were observed throughout the period, with a 24-dB lower median RSRP and a 3-dB higher RSRQ compared to terrestrial networks, reflecting the SMS-only usage of the DS2D network during this period.":"整段觀測期間的實體層量測大致穩定；相較地面網路，RSRP中位數低24 dB，RSRQ則高3 dB，這反映當時DS2D網路僅供簡訊使用。","Based on the SINR measurements collected, we estimate the expected performance of the announced DS2D mobile data service to be around 3 Mb/s per beam in outdoor conditions.":"根據蒐集的SINR量測，我們推估已宣布的DS2D行動數據服務在戶外條件下，每波束約可提供3 Mb/s。","We also discuss strategies to expand this capacity up to 18 Mb/s in the future, depending on key regulatory and business decisions, including allowable out-of-band emissions, permitted number of satellites, and availability of spectrum and orbital resources.":"我們也討論未來將容量提高至每波束18 Mb/s的策略，但其可行性取決於法規與商業決策，包括允許的帶外發射、核准衛星數量，以及頻譜和軌道資源的取得。","In this article, we presented the first empirical analysis of a commercially deployed DS2D network, focusing on Starlink’s SCS Service in the US in partnership with T-Mobile.":"本文首次對商用部署的DS2D網路進行實證分析，研究焦點為Starlink與T-Mobile在美國合作提供的SCS服務。","Using largescale crowdsourced measurements between October 2024 and July 2025, we characterized the spatio-temporal evolution and RAN performance of the DS2D network, which only supported SMS during the observed period.":"我們利用2024年10月至2025年7月的大規模群眾協作量測資料，分析該DS2D網路的時空演進與無線接取網路（RAN）效能；觀測期間網路僅支援簡訊。","Our results confirm a strong correlation between the number of DS2D-capable satellites launched and the number of unique cell identifiers observed, as well as a spatial distribution of measurements consistent with the operator’s coverage gaps.":"研究結果證實，具備DS2D能力的發射衛星數量與觀察到的不重複小區識別碼數量具有高度相關性，而量測的空間分布也符合電信業者的覆蓋缺口。","We observe a significant number of measurements concentrated around areas that are relatively accessible yet underserved by terrestrial networks, such as national parks.":"我們觀察到大量量測資料集中於相對容易到達、卻缺乏良好地面網路服務的地區，例如國家公園。","Furthermore, we find significant negative correlation between the prevalence of Starlink measurements and population density, reflecting its role as a complementary solution in sparsely populated regions.":"此外，Starlink量測資料的出現比例與人口密度呈顯著負相關，反映其作為人口稀少地區補充性連線方案的角色。","The measurements indicate slight increases in RSRP, RSRQ, and SINR throughout the beta test-":"整個測試期間，RSRP、RSRQ與SINR略為增加，可能與網路調整有關，包括FCC核准更高的帶外發射（OOBE）水準，以及部分衛星部署至極低地球軌道（VLEO）。","1ing period, which may be attributable to network changes, including the higher OOBE levels authorized by the FCC and the deployment of some satellites at VLEO altitudes.":"這可能與網路變動有關，包括FCC核准較高的帶外發射水準，以及部分衛星部署至VLEO高度。","1 Mb/s, which is sufficient for basic services but significantly below terrestrial averages.":"此速度足以支援基本服務，但仍明顯低於地面網路的平均水準。","5 \\mathrm{Mb} / \\mathrm{s}$ for LEO, assuming that OOBEs relaxation has not been applied yet.":"假設尚未放寬帶外發射限制，LEO的預估數值約為4.5 Mb/s。","6 Mb/s in the medium term once NTN bands are integrated into commercial smartphone modems.":"中期若商用智慧型手機數據機整合NTN頻段，容量有望達到18.6 Mb/s。","However, the extent to which these enhancements translate into higher per-user throughput will ultimately depend on the expansion of the satellite constellation and the evolution of service demand.":"然而，這些改善能轉化為多少用戶吞吐量，仍取決於衛星星座的擴張與服務需求的演變。","Our work illustrates the value of crowdsourced data to monitor emerging network technologies.":"本研究顯示群眾協作資料對監測新興網路技術具有價值。","Beyond characterizing deployment and performance, such data can help detect underserved zones, assess coverage gaps, and inform infrastructure planning, offering a promising tool for both technical and policy research on mobile communication systems.":"這類資料除了能描述網路部署與效能，還能辨識服務不足區域、評估覆蓋缺口並支援基礎建設規劃，對行動通訊技術與政策研究具有潛力。","We would like to thank Dr Tim Farrar for bringing one of the references to our attention, and Dr Fadi Saibi for several corrections to an early version of the manuscript.":"我們感謝Tim Farrar博士提醒我們注意其中一篇參考文獻，也感謝Fadi Saibi博士對論文初稿提出數項修正。","This work has been partially supported by Weplan Analytics through the CROWD-X project and by UPM’s Doctores Emergentes program (24-ED3B0Y-100-JOQZ29), funded by the Region of Madrid.":"本研究部分獲得Weplan Analytics的CROWD-X計畫，以及馬德里自治區資助之UPM Doctores Emergentes計畫（24-ED3B0Y-100-JOQZ29）的支持。","Future work will involve monitoring the evolution of DS2D networks and services, tracking the evolution of Starlink’s network as new services are introduced, and exploring other emerging DS2D deployments.":"未來將持續監測DS2D網路與服務的發展、追蹤Starlink導入新服務後的變化，並研究其他新興DS2D部署。"};const translationsById={"1-0-0":"LEO大型衛星星座已成為服務不足地區可行的寬頻接取方案。","1-0-1":"2024年，Starlink與T-Mobile合作開始測試僅支援簡訊的太空補充覆蓋（SCS）服務。","1-0-2":"這是衛星直接連接終端設備（DS2D）通訊首次大規模部署，讓未改裝的智慧型手機能直接連接太空基地臺。","1-0-3":"本文首次研究已部署DS2D技術的實際量測結果。","1-0-4":"根據2024年10月至2025年7月美國的群眾協作行動網路量測，我們實證分析DS2D的能力、限制與未來發展。","1-0-5":"衛星部署數量、不重複小區識別碼數量與量測資料量高度相關；量測集中於國家公園和人口稀少的郡等地面覆蓋不足但可到達的地區。","1-0-6":"觀測期間實體層量測大致穩定；相較地面網路，RSRP中位數低24 dB，RSRQ高3 dB，反映當時DS2D僅供簡訊使用。","1-0-7":"根據SINR量測，我們估計未來DS2D數據服務戶外每波束的速率約為3 Mb/s。","1-0-8":"本文也探討如何將容量提高至每波束18 Mb/s，取決於帶外發射限制、准許衛星數量，以及頻譜與軌道資源等法規及商業決策。","2-0-0":"近年來，特別自2020年起，低地球軌道（LEO）大型衛星星座已成為固定寬頻服務中可行且日益普遍的非地面網路（NTN）接取方案。","2-0-1":"SpaceX的Starlink、Eutelsat的OneWeb及Amazon的Kuiper等網路，正在克服傳統地球同步衛星通訊長期存在的限制。","2-0-2":"由於軌道高度降低至500～1200公里，這些衛星星座的延遲與地面網路相近（通常數十毫秒，而地球同步衛星為數百毫秒），可支援視訊會議及線上遊戲等即時應用[1]。","2-1-0":"隨著固定寬頻技術發展，衛星直接連接終端設備（DS2D）已成為讓標準、未改裝智慧型手機無縫連線的可行方案。","2-1-1":"SpaceX衛星通訊部門Starlink透過快速部署使用地面IMT頻譜、但不符合3GPP NTN規範的方案，成為全球DS2D通訊領導業者。","2-1-2":"Starlink與T-Mobile合作並使用其頻譜，率先展開太空補充覆蓋（SCS）服務的大規模測試。","2-1-3":"系統初期僅支援簡訊（SMS），原計畫2025年底前支援語音及數據服務。","2-2-0":"本文研究Starlink的SCS服務，分析其稱為Direct-to-Cell的DS2D網路特性。","2-2-1":"利用Weplan Analytics提供、包含2024年10月至2025年7月數百萬筆群眾協作量測的大型資料集，我們探討DS2D網路設計對行動網路規劃與頻譜政策的影響。","2-2-2":"主要研究貢獻如下：","2-3-0":"首次從空間及時間面向，以實際量測研究商業營運中的DS2D網路。","2-4-0":"大規模實證評估Starlink DS2D網路的實體層無線接取網路（RAN）參數，包括參考訊號接收功率（RSRP）、參考訊號接收品質（RSRQ）及訊號對干擾加雜訊比（SINR）。","2-5-0":"評估Starlink未來SCS數據服務的預期效能與網路容量擴充策略。","2-6-0":"本文其餘內容安排如下。","2-6-1":"首先介紹LEO衛星網路的演進及相關研究。","2-6-2":"其次介紹資料集與分析方法。","2-6-3":"接著呈現並討論結果。","2-6-4":"最後提出結論與未來研究方向。","4-0-0":"近數十年來，衛星微型化、發射能力改善及普遍連線需求增加，推動LEO衛星通訊顯著進步。","4-0-1":"1990年代末期的早期LEO星座，主要為偏遠及服務不足地區提供語音與低速數據服務。","4-0-2":"2010年代末期大型衛星星座出現，開啟LEO通訊的新階段[2]。","4-0-3":"Starlink與OneWeb等計畫開始部署廣泛的LEO衛星網路，提供全球寬頻網路接取。","4-1-0":"電子、嵌入式系統、數位訊號處理與波束成形等技術的重大進步，也促成DS2D發展[3]。","4-1-1":"具體而言，DS2D需要衛星配備先進相位陣列天線、高靈敏度無線電接收器與高功率發射器。","4-1-2":"此外，須補償都卜勒頻移和傳播延遲，以克服行動終端至衛星鏈路的物理限制，並利用軟體定義無線電（SDR）適應不同頻率與技術。","4-2-0":"3GPP已於Release 17規範中納入NTN。","4-2-1":"協定經過強化，以應對衛星通訊特性，例如終端與衛星距離較長，會影響HARQ混合式自動重傳與隨機接取等程序。","4-2-2":"系統資訊區塊也擴充為可傳送軌道位置等衛星專用參數。","4-2-3":"後續版本將進一步改善覆蓋（可能延伸室內）、支援鄰近小區量測並減少電池消耗。","4-3-0":"Starlink率先部署DS2D，策略是在可行的最低軌道高度建立密集LEO星座（目前主要約550公里，少數約350公里，須與NASA協調）。","4-3-1":"主要競爭者AST SpaceMobile則採用較不密集、較高軌道（約700公里）的星座，搭配超大型天線陣列。","4-3-2":"兩家業者迄今主要透過與各國行動網路業者合作取得IMT頻譜，但也開始爭取自有地面與衛星頻譜。","4-3-3":"其他DS2D生態系參與者包括Lynk Global、Skylo及Viasat-Inmarsat。","4-3-4":"主要應用包括物聯網普遍連線、地面網路補充覆蓋、SOS警報、緊急通訊及海事與航空連線。","5-0-0":"Starlink自2019年首次發射以來已部署超過7000顆衛星，重塑衛星通訊產業。","5-0-1":"最初的透明轉發（bent-pipe）架構[4]採用較簡單的衛星設計，可快速部署，但需建立密集地面站網路維持連續覆蓋。","5-0-2":"自2022年起，Starlink逐步導入雷射衛星間鏈路（ISL），並在第二代（Gen2）衛星群全面採用，實現星上訊號處理與太空路由。","5-0-3":"從依賴地面站中繼轉向太空網狀網路，使覆蓋更廣、韌性更高，並改善端到端效能[1]。","5-1-0":"Starlink沒有等待3GPP完成NTN標準化，而是將傳統LTE eNodeB基地臺酬載整合至衛星，再以專有技術適應NTN運作，提前部署。","5-1-1":"智慧型手機因此能直接使用地面行動通訊標準連接，流量經由地面站處理，必要時也能透過ISL跨衛星轉送[5]。","5-2-0":"SpaceX在2024年12月宣布完成首個DS2D星座，約400顆衛星，僅占已部署衛星群約6%。","5-2-1":"除與T-Mobile合作在美國提供SCS服務外，也透過合作在紐西蘭與澳洲提供服務，並與其他數國業者測試。","5-3-0":"2024年11月，FCC部分核准Starlink的DS2D營運及簡訊測試，但為避免對既有地面和衛星系統造成有害干擾，要求經證實干擾時立即停發、限制總合帶外發射（OOBE）功率通量密度，並與既有業者協調。","5-3-1":"2025年3月，儘管AT&T、Verizon及EchoStar反對，FCC仍有條件允許Starlink提高OOBE 9.4 dB，但要求持續遵守嚴格限制並積極解決干擾問題。","5-4-0":"在美國，Starlink測試僅使用T-Mobile在美國本土獲准使用的PCS G頻段：上行1910～1915 MHz、下行1990～1995 MHz，總配置2×5 MHz。2025年9月測試結束後，Starlink向EchoStar取得AWS-4行動衛星服務（MSS）頻譜權利（上行2000～2020 MHz、下行2180～2200 MHz，2×20 MHz），以及PCS H頻段（上行1915～1920 MHz、下行1995～2000 MHz，2×5 MHz）。","5-4-1":"新增頻譜顯著擴大Direct-to-Cell可用資源，尤其AWS-4與5G NR NTN的n252頻段重疊。","6-0-0":"隨著LEO衛星通訊迅速創新，不同領域逐漸累積探討系統設計、部署與營運的研究。","6-0-1":"早期研究聚焦支撐LEO寬頻的技術，包括透明轉發與ISL等網路架構、混合式波束成形、干擾協調與資源管理[2]。","6-0-2":"雖然最初以固定衛星寬頻為主，近年關注已轉向DS2D[6]；除理論架構研究外，也開發Hypatia和StarPerf等工具，以在營運條件下更真實地模擬、設計與評估LEO衛星網路。","6-1-0":"隨著網路開始部署營運，已有愈來愈多針對Starlink固定衛星寬頻的量測研究[1,7–9]。","6-1-1":"這些研究主要評估使用專用固定終端（衛星碟形天線）的連線，尤其是吞吐量與延遲，而高延遲是傳統地球同步衛星系統的主要限制。","6-2-0":"儘管LEO研究日益增加，據作者所知，仍沒有對商用DS2D部署的實證評估。","6-2-1":"本文利用Starlink在美國測試期間的大規模群眾協作量測，首次分析真實DS2D網路。","7-0-0":"本研究採用以資料為基礎、以使用者為中心的方法，分析大規模群眾協作行動網路量測。","7-0-1":"群眾協作量測可從獨特視角評估行動網路效能，即使在人口稀少地區也能捕捉實際使用體驗[10]。","7-0-2":"資料由Weplan Analytics提供，其資料蒐集架構專門用來擷取及評估RAN效能。","7-0-3":"原始量測為專有資料而無法分享，但本文完整說明衍生統計與分析程序，以利重現研究方法。","7-0-4":"我們先介紹資料來源與前處理，再說明如何估算SCS服務的潛在占比，最後介紹根據SINR計算DS2D預期效能的方法。","8-0-0":"主要資料來源為2024年10月至2025年7月從Android裝置被動收集的LTE群眾協作量測。","8-0-1":"提供資料的業者在蒐集時即完成匿名化，以符合適用的資料保護法規。","8-0-2":"使用的網路變數如下：","8-1-0":"第一類為3GPP規範[11]定義的RAN參數：RSRP、RSRQ、SINR、EARFCN與ECI（E-UTRAN小區識別碼）。","8-1-1":"無線接取網路（RAN）參數包括RSRP、RSRQ、SINR、EARFCN及ECI（E-UTRAN小區識別碼），定義見3GPP規範[11]。","8-2-0":"第二類為公眾陸地行動網路（PLMN）識別碼，包括行動國家碼（MCC）和行動網路碼（MNC）。","8-2-1":"使用MCC=310、MNC=830或210篩選Starlink量測，MNC=260則用於T-Mobile地面網路的比較資料。","8-2-2":"我們以MCC=310、MNC=830或210篩選Starlink量測，並以MNC=260篩選T-Mobile地面網路量測，用來與Starlink進行比較。","8-3-0":"此外，我們加入三種輔助資料來源，以評估群眾協作資料的一致性和可靠性。","8-3-1":"第一，根據SpaceX官方任務報告彙整在軌DS2D衛星累計數量的時間變化，並作為補充材料公開[12]。","8-3-2":"第二，使用公開的T-Mobile覆蓋地圖，比較DS2D量測的空間分布是否與缺乏地面覆蓋的區域一致。","8-3-3":"最後，使用美國各郡和國家公園的官方開放向量資料量化SCS占比，並用美國人口普查局的郡級人口資料分析SCS占比與人口密度的相關性。","9-0-0":"為估計某地理區域依賴Starlink SCS服務的可能性，我們定義名為SCS占比（SCS share）的空間指標。","9-0-1":"它用Starlink DS2D量測數量除以所有量測總數（包含Starlink DS2D和T-Mobile各技術、各頻段的地面網路量測），表示Starlink連線在資料集中的相對普遍程度。","9-0-2":"因此，可用來衡量Starlink在特定區域扮演主要行動覆蓋提供者的程度。","10-0-0":"為評估未來DS2D數據服務效能，我們採用文獻[13]提出的LTE修正Shannon公式，估計每波束下行頻譜效率η（bps/Hz）。","10-0-1":"不使用空間多工時，公式為η=min{s·a·log₂(1+SINR/b),m}：s是頻寬效率係數，涵蓋保護頻帶、導頻與訊號通道等系統負擔；a、b是反映實作損失的擬合係數；m是最高調變編碼方案（MCS）施加的上限。","10-0-2":"s與m可由理論計算，a和b則從模擬調整。","10-0-3":"本文假設沒有衰落、只有加性白高斯雜訊（AWGN）且不使用空間多工的靜態通道。","10-0-4":"文獻[13]在這些條件下給出s=0.57、a=0.9、b=1.25。","10-0-5":"參數m取決於LTE網路使用的技術。","10-0-6":"最高MCS可採64-QAM、256-QAM或1024-QAM，編碼率接近1。","10-0-7":"本文採256-QAM作為參考；行動終端可回報的最高通道品質指標（CQI）對應每符元7.41個資訊位元[14，表7.2.3-2]。","10-0-8":"考慮已納入循環字首及其他系統負擔的效率係數s後，得到m=4.22 bps/Hz。","10-0-9":"因此頻譜效率公式為η=min{0.51·log₂(1+SINR/1.25),4.22}。","10-0-10":"依照文獻[13]，先對每個SINR計算頻譜效率，再對整體SINR分布取平均。"};const vocab=[["reshape","重塑"],["telecommunication","電信通訊"],["deployment","部署"],["architecture","架構"],["resilience","韌性"],["relay","中繼"],["constellation","衛星星座"],["spectrum","頻譜"],["interference","干擾"],["throughput","吞吐量"],["crowdsourced","群眾協作蒐集的"],["spectral efficiency","頻譜效率"],["downlink","下行鏈路"],["uplink","上行鏈路"]];

sections.forEach((s,i)=>chap.add(new Option(s.title,i)));const initial=Number(localStorage.getItem('paperSection')||0);chap.value=Math.min(initial,sections.length-1);
function updateProgress(){document.querySelector('#progress').value=100*done.size/Math.max(1,all.length);const i=Number(chap.value),list=sections[i].paragraphs.flatMap((p,j)=>split(p).map((v,k)=>({id:i+'-'+j+'-'+k,text:v})));const translated=list.filter(x=>Boolean(translationsById[x.id]||translations[x.text])).length;document.querySelector('#progressText').textContent='全文已讀 '+done.size+' / '+all.length+' 句｜本章 '+list.length+' 句、已翻譯 '+translated+' 句';}
function speak(text,el){speechSynthesis.cancel();document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number(document.querySelector('#rate').value);u.voice=speechSynthesis.getVoices().find(v=>v.lang==='en-US')||null;u.onstart=()=>el.classList.add('playing');u.onend=()=>el.classList.remove('playing');speechSynthesis.speak(u)}
function render(){let i=Number(chap.value);localStorage.setItem('paperSection',i);content.replaceChildren();let section=sections[i];let title=document.createElement('h2');title.textContent=section.title;content.append(title);section.paragraphs.forEach((p,j)=>{const card=document.createElement('div');card.className='card';split(p).forEach((sentence,k)=>{let id=i+'-'+j+'-'+k;let row=document.createElement('div');row.className='sentence';let text=document.createElement('p');text.textContent=sentence;let actions=document.createElement('div');actions.className='actions';let play=document.createElement('button');play.textContent='▶ 朗讀';play.onclick=()=>speak(sentence,row);actions.append(play);let trans=translationsById[id]||translations[sentence];let reveal=document.createElement('button');reveal.className='secondary';reveal.textContent='翻譯';let translation=document.createElement('div');translation.className='translation';translation.hidden=true;translation.textContent=trans||'此句繁體中文翻譯尚未完成';reveal.onclick=()=>{translation.hidden=!translation.hidden};actions.append(reveal);let mark=document.createElement('button');mark.className='secondary';function sync(){mark.textContent=done.has(id)?'✓ 已讀':'○ 標記已讀'}sync();mark.onclick=()=>{done.has(id)?done.delete(id):done.add(id);localStorage.setItem('paperDone',JSON.stringify([...done]));sync();updateProgress()};actions.append(mark);row.append(text,actions,translation);card.append(row)});content.append(card)});updateProgress()}
chap.onchange=render;vocab.forEach(([a,b])=>{let r=document.querySelector('#words').insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b});render();
</script></body></html>
