const sections=[{"title":"Direct-to-Cell: A First Look into Starlink’s Direct Satellite-to-Device Radio Access Network through Crowdsourced Measurements","level":1,"paragraphs":["Jorge Garcia-Cabeza, Javier Albert-Smet, Zoraida Frias, Luis Mendo, Santiago Andrés Azcoitia, and Eduardo Yraola"]},{"title":"Abstract","level":4,"paragraphs":["Low Earth Orbit (LEO) satellite mega-constellations have emerged as a viable access solution for broadband connectivity in underserved areas. In 2024, Starlink, in partnership with T-Mobile, began beta testing an SMS-only Supplemental Coverage from Space (SCS) service. This marks the first large-scale deployment of Direct Satellite-to-Device (DS2D) communications, allowing unmodified smartphones to connect directly to spaceborne base stations. This article presents the first measurement study of deployed DS2D technologies. Using crowdsourced mobile network data from the U.S. between October 2024 and July 2025, we provide evidence-based insights into the capabilities, limitations, and future evolution of DS2D technologies for extending mobile connectivity. We find a strong correlation between the number of satellites deployed, the number of unique cell identifiers measured, and the volume of measurements, concentrated in accessible areas with poor terrestrial network coverage, such as national parks and sparsely populated counties. Stable physical-layer measurements were observed throughout the period, with a 24-dB lower median RSRP and a 3-dB higher RSRQ compared to terrestrial networks, reflecting the SMS-only usage of the DS2D network during this period. Based on the SINR measurements collected, we estimate the expected performance of the announced DS2D mobile data service to be around 3 Mb/s per beam in outdoor conditions. We also discuss strategies to expand this capacity up to 18 Mb/s in the future, depending on key regulatory and business decisions, including allowable out-of-band emissions, permitted number of satellites, and availability of spectrum and orbital resources."]},{"title":"Introduction","level":2,"paragraphs":["In recent years, particularly from 2020, Low Earth Orbit (LEO) mega-constellations have become a viable and increasingly widespread Non-Terrestrial Network (NTN) Internet access solution for fixed broadband services. Networks like SpaceX’s Starlink, Eutelsat’s OneWeb or Amazon’s Kuiper are successfully addressing longstanding limitations of traditional geostationary satellite communications. By operating at significantly lower altitudes (500-1200 km), these constellations offer latency levels comparable to those of terrestrial networks (typically tens of milliseconds vs. the hundreds associated with geostationary satellites), supporting real-time applications such as video conferencing and online gaming [1].","Following technological developments in fixed broadband connectivity, satellite-based cellular communications, known as Direct Satellite-to-Device (DS2D), have become a promising solution to provide seamless connectivity directly to standard unmodified smartphones. Starlink, the satellite communications division of SpaceX, has emerged as the global leader in DS2D communications by rapidly deploying a non-3GPPNTN-compliant solution that leverages terrestrial International Mobile Telecommunications (IMT) spectrum. In partnership with T-Mobile and using its spectrum, Starlink has been the first company to launch large-scale beta testing of a Supplemental Coverage from Space (SCS) service. The system is initially limited to Short Message Service (SMS), with support for voice and data services planned by late 2025.","In this article, we examine Starlink’s SCS services and characterize its DS2D network - referred to by Starlink as Direct-to-Cell. Using a large-scale dataset provided by the company Weplan Analytics comprising millions of crowdsourced measurements collected from October 2024 to July 2025,our analysis provides valuable insights into the implications of DS2D network design for mobile network planning and spectrum policy. The main contributions of this work are:","- The first measurement-based study of a commercially operating DS2D network, encompassing both spatial and temporal dimensions.","- A large-scale empirical evaluation of physical-layer Radio Access Network (RAN) parameters of Starlink’s DS2D network, namely Reference Signal Received Power (RSRP), Reference Signal Received Quality (RSRQ) and Signal-to-Interference-plus-Noise Ratio (SINR).","- An assessment of the projected performance of Starlink’s future SCS data services and strategies for network capacity expansion.","The remainder of this article is structured as follows. We first provide background on the evolution of LEO satellite networks and summarize related research. Secondly, we describe the dataset and our analytical approach. We then present and discuss the results. Finally, we offer conclusions and suggest future research."]},{"title":"BackGround","level":2,"paragraphs":[]},{"title":"Technological Evolution and Emerging Ecosystem","level":2,"paragraphs":["LEO satellite communications have progressed considerably in recent decades, driven by satellite miniaturization, improved launch capabilities, and the growing demand for ubiquitous connectivity. Early LEO constellations in the late 1990s were primarily designed to deliver voice and low-speed data services to remote and underserved areas. A new phase in LEO communications emerged in the late 2010s with the advent of mega-constellations [2]. Initiatives such as SpaceX’s Starlink and OneWeb began deploying extensive LEO satellite networks to provide broadband Internet access globally.","DS2D has been further enabled by significant progress in electronics, embedded systems, digital signal processing, and beamforming technologies, among others [3]. Specifically, DS2D connectivity relies on the satellites being equipped with advanced phased array antennas, highly sensitive radio receivers, and high-power transmitters. Moreover, compensation for Doppler shift and delay is essential to overcome the physical constraints of mobile-to-satellite links, and software-defined radio (SDR) is necessary to adapt the system to varying frequencies and technologies.","3GPP specifications have recently incorporated NTN in Release 17. Protocols have been enhanced to address the distinctive characteristics of satellite-based communications, such as the larger propagation distance between user terminals and satellites, which impacts procedures including hybrid automatic repeat request (HARQ) and random access. In addition, system information blocks have been extended to convey satellite-specific parameters, such as orbital position. Subsequent releases introduce further enhancements, focusing on improved coverage (potentially extending to indoor environments), support for neighbor cell measurements, and reduced battery consumption.","Starlink has pioneered DS2D deployments with a strategy focused on a dense LEO constellation at the lowest feasible orbital altitudes (currently primarily \\~ 550 km and selectively \\~ 350 km subject to coordination with NASA). In contrast, its main competitor, AST SpaceMobile, relies on a less dense constellation at higher altitudes (\\~ 700 km), supported by very large antenna arrays. Although both operators have so far relied primarily on IMT spectrum obtained through agreements with mobile network operators in different countries, they are now pursuing their own terrestrial and satellite spectrum. Other actors in the emerging DS2D ecosystem include Lynk Global, Skylo, and Viasat-Inmarsat. Key use cases comprise ubiquitous connectivity for IoT, supplementary coverage for terrestrial mobile networks, SOS alerts, emergency communications, and maritime and aeronautical connectivity."]},{"title":"Starlink’s Direct Satellite-to-Device Approach","level":2,"paragraphs":["Starlink has reshaped the satellite telecommunication sector by deploying over 7,000 satellites since its first launches in 2019. The bent-pipe architecture initially adopted [4] enabled rapid deployment using simpler satellite designs at the cost of deploying a dense network of ground stations to ensure continuous coverage. From 2022 onward, Starlink progressively introduced laser inter-satellite links (ISL), fully adopted in its second-generation (“Gen2”) fleet, enabling onboard signal processing and space-based routing. This transition from a ground-dependent relay to a space-based mesh brings expanded coverage, improved resilience, and enhanced end-to-end performance [1].","Rather than awaiting the completion of 3GPP standardization of NTN, Starlink pursued an early deployment strategy by integrating conventional LTE eNodeB payloads into its satellites, complemented with proprietary adaptations for NTN operation. This allows smartphones to connect natively using terrestrial mobile standards, while traffic is handled either through the company’s ground station network or, when necessary, routed across the constellation via ISLs [5].","SpaceX announced the completion of its first DS2D constellation in December 2024, consisting of approximately 400 satellites - barely 6% of their deployed fleet. In addition to the SCS service provided in the U.S. through the partnership with T-Mobile, the constellation also offers SCS connectivity in New Zealand and Australia via a partnership with operators and is under testing with operators in several other countries.","In November 2024, the FCC granted partial approval for Starlink’s DS2D operations to initiate the SMS-only beta testing, but imposed several conditions to prevent harmful interference with terrestrial and satellite incumbents, including the requirement to stop transmission immediately upon any substantiated claim of interference, limitations on power flux density levels for aggregate out-ofband emissions (OOBE), and mandatory coordination procedures with incumbents. ^{1}$ Subsequently, in March 2025, the FCC approved ^{2}$ a conditional waiver allowing Starlink to increase its OOBE by 9.4 dB, despite formal objections from terrestrial operators, including AT&T and Verizon, and EchoStar. The waiver stipulated that Starlink must continue to adhere to strict OOBE limits and engage in active interference resolution with affected parties.","In the U.S., Starlink’s DS2D beta operations have relied exclusively on the PCS G Block, a 2 $\\times 5 \\mathrm{MHz}$ channel at 1910-1915 MHz (uplink) and 1990-1995 MHz (downlink), which is part of the IMT spectrum licensed to T-Mobile across the contiguous United States. ^{3}$ In September 2025, having concluded the beta phase, Starlink acquired Mobile Satellite Service (MSS) spectrum rights from Echostar in the AWS-4 band (20002020 MHz uplink, 2180-2200 MHz downlink, 2 $\\times 20 \\mathrm{MHz})$ and IMT PCS H Block (1915-1920 MHz uplink, 1995-2000 MHz downlink, $2 \\times 5$ MHz). These additional allocations significantly expand the spectrum available for its Direct-toCell operations, particularly since the AWS-4 band overlaps with the 5G NR NTN band n252."]},{"title":"Related Work","level":2,"paragraphs":["Mirroring the rapid pace of innovation of LEO satellite communication technologies, a growing body of research has emerged from multiple perspectives to explore the design, deployment, and operation of these systems. Early studies focused primarily on the technologies that underpin LEO broadband services, addressing alternative network architectures (e.g., bent-pipe versus ISL designs), hybrid beamforming strategies, interference coordination mechanisms, and resource management challenges [2]. Although much of this work was initially centered on fixed satellite broadband services, recent attention has shifted toward DS2D communications [6], which is reflected in dedicated research and publication initiatives. ^{4}$ Alongside theoretical and architectural advances, new simulation tools, such as Hypatia and StarPerf, have been developed to support realistic modeling, design, and performance evaluation of LEO satellite networks under operational conditions.","Following initial deployments and the establishment of operational networks, a growing number of measurement studies have emerged, focusing on Starlink’s fixed satellite broadband services [1, 7-9]. These studies have primarily evaluated connectivity delivered through dedicated fixed user terminals (i.e., satellite “dishes”), with particular attention to metrics such as throughput and latency, a major historical limitation of traditional geostationary satellite systems.","Despite growing research on LEO satellite networks, to the best of our knowledge, there are no empirical evaluations of commercial DS2D deployments. This article presents the first measurement-based analysis of a real-world DS2D network, using large-scale crowdsourced mobile data collected during the beta testing phase of Starlink’s service in the U.S."]},{"title":"Methodology","level":2,"paragraphs":["In this study, we adopt a data-driven, user-centric methodology based on large-scale crowdsourced mobile measurements. Crowdsourced measurements offer a unique vantage point for evaluating cellular network performance, capturing realworld user experience even in sparsely populated areas [10]. The dataset is provided by the crowdsourcing company Weplan Analytics, whose data collection framework is specifically designed to capture and evaluate RAN performance. While the raw crowdsourced measurements are proprietary and cannot be shared, the derived statistics and analytical procedures are fully described in this article to enable methodological reproducibility. We first describe the data sources and the data preprocessing; then we present how we estimate the potential share of SCS services; and lastly we detail how we calculate the expected performance of DS2D communications based on SINR measurements."]},{"title":"Data Sources","level":2,"paragraphs":["Our primary data source consists of LTE crowdsourced measurements passively collected from Android user devices between October 2024 and July 2025. All data were anonymized at collection time by the crowdsourcing provider to ensure full compliance with applicable data protection regulations. We used the following network variables:","1. RAN parameters RSRP, RSRQ, SINR, EARFCN, ECI (E-UTRAN Cell Identifier) as defined in 3GPP specifications [11],","2. PLMN (Public Land Mobile Network) identifier, comprising Mobile Country Code (MCC) and Mobile Network Code (MNC). We filter with MCC = 310 and MNC = 830 or 210 for Starlink measurements, and MNC = 260 for T-Mobile’s terrestrial network measurements, which we compare with Starlink’s.","In addition, we incorporate three complementary data sources that help assess the consistency and reliability of the crowdsourced dataset. First, we compiled a dataset tracking the evolution of the cumulative number of Starlink’s DS2D-capable satellites in orbit by aggregating information from official SpaceX mission reports, which we publish openly as supplementary material [12]. Second, we used the publicly available T-Mobile coverage map to evaluate how well the spatial distribution of DS2D measurements aligns with areas designated as lacking terrestrial coverage. Finally, we used official open-data vector files for U.S. counties and national parks to quantify the SCS share, as detailed next, and official county-level population data from the U.S. Census Bureau to study the correlation of SCS share and population density."]},{"title":"Measuring SCS Share","level":2,"paragraphs":["To estimate the likelihood of relying on Starlink SCS services in a particular geographic area, we define a spatial indicator called SCS share. This metric quantifies the relative prevalence of Starlink DS2D connectivity in our dataset by computing the ratio of Starlink DS2D measurements to the total number of measurements observed (i.e., Starlink DS2D and T-Mobile terrestrial network measurements across all technologies and frequency bands). It thus indicates the degree to which Starlink serves as the primary mobile coverage provider in a given area."]},{"title":"Estimating DS2D Performance","level":2,"paragraphs":["To assess the performance of future DS2D data services, we use the modified Shannon formula for LTE introduced in [13] to estimate the downlink spectral efficiency of the system, $\\eta(\\mathrm{bps} / \\mathrm{Hz}$ per beam). This formula, for the case of no spatial multiplexing, is $\\eta=\\min \\left\\{s\\right.$ a $\\log _{2}(1+\\operatorname{SINR} / b)$, $m\\}$, where $s$ is a bandwidth efficiency factor, which accounts for all system overhead including guard bands, pilot symbols and signaling channels; $a, b$ are fitting coefficients, which model implementation-related losses; and $m$ is a limit imposed by the highest modulation and coding scheme (MCS) that the system can use. The terms $s$ and $m$ can be computed theoretically, whereas a, $b$ are adjusted from simulation. We consider a static (no fading)channel model with AWGN and no spatial multiplexing. In these conditions, [13] gives the values $s=0.57, a=0.9, b=1.25$. The parameter $m$ depends on the specific technology used by the LTE network. The highest supported MCS can be 64-, 256- or 1024-QAM, with a coding rate close to 1. As a reference, we use 256-QAM, for which the best channel-quality indicator (CQI) that the mobile terminal can report corresponds to 7.41 information bits per symbol [14, Table 7.2.3-2]. Taking into account the efficiency factor s, which already incorporates the effect of the cyclic prefix (as well as other types of overhead), this yields $m=$ 4.22 bps/Hz. Thus, the expression for spectral efficiency results in: $\\eta=\\min \\left\\{0.51 \\log _{2}(1+\\operatorname{SINR} / 1.25)\\right.$, 4.22\\}. Following [13], the spectral efficiency is computed for each SINR value, and then averaged over the SINR distribution."]},{"title":"Results","level":2,"paragraphs":["This section presents our empirical findings. We start by assessing the relationship between the observed number of cell identifiers and the satellites in orbit. We then examine the spatial availability of Starlink’s SCS service, characterizing the evolution of its geographic footprint, and quantifying its SCS share across different types of areas. Following that, we analyze key RAN performance indicators, including RSRP, RSRQ, and SINR. Lastly, based on these metrics, we estimate the expected capacity of DS2D data services, and discuss and quantify alternatives to improve it."]},{"title":"Network Expansion vs. Constellation Deployment","level":2,"paragraphs":["Figure 1 shows the evolution of the number of cumulative unique cell identifiers (ECIs) associated with Starlink’s DS2D network, as observed in our dataset over the measurement period. The results reveal a steady upward trend, closely correlated with the timeline of Gen2 satellite launches. This finding suggests that crowdsourcing may serve as a useful tool for large-scale characterization of DS2D networks, and challenges the common perception that such data are inherently biased toward urban areas. On the contrary, our results demonstrate that crowdsourced measurements offer valuable insights in sparsely populated regions, which lack robust terrestrial coverage and are precisely where SCS services are expected to make the greatest impact."]},{"title":"Starlink’s DS2D Spatial Analysis","level":2,"paragraphs":["Although satellite constellations are designed to provide global coverage by definition, the potential use of SCS services is not geographically uniform. In practice, DS2D observability varies significantly across regions, influenced by factors such as terrestrial network availability, operator deployment strategies, population density, and accessibility.","Figure 2 shows the evolution of the spatial distribution of Starlink’s DS2D mobile crowdsourced measurements. Initial measurements in late 2024 were concentrated in southeastern states affected by hurricanes, where the service temporarily substituted inoperative terrestrial networks, with a comparable pattern observed during the January 2025 Southern California wildfires. Following the official beta launch in early 2025, measurements expanded nationwide, and by March-April 2025, adoption had intensified considerably. The measurements further suggest that service activation during the initial phases was geographically constrained until the constellation reached completion, as early activity was limited to specific regions.","In Fig. 3, we present a logarithmic-scale heatmap showing the number of observed Starlink DS2D measurements overlaid on T-Mobile’s public coverage map. The comparison offers several noteworthy insights. First, DS2D measurements are concentrated primarily in areas designated by T-Mobile as having satellite-only coverage, with some also appearing in areas nominally served by terrestrial networks, suggesting potential reliability issues. Second, most DS2D measurements are concentrated in accessible yet underserved regions near populated zones, particularly around national parks.","A quantitative analysis using the SCS share indicator (as defined earlier) confirms that large national parks such as Death Valley and Yellowstone exhibit high reliance on DS2D, with values of 0.86 and 0.80 , respectively. Figure 4 plots the SCS share against population density, computed at a county level. Counties such as Knott (KY). Florence (WI), and Martin (KY), also located near national parks, show SCS share values exceeding 0.85. Overall, we find a moderately strong negative logarithmic correlation with county-level population density (Pearson correlation coefficient: -0.57)."]},{"title":"Analysis of DS2D Key Performance Indicators","level":2,"paragraphs":["Over the past decade, mobile networks have become an essential means of accessing the Internet for billions of users worldwide. Despite a remarkable growth in mobile network coverage, significant portions of the global population remain underserved by terrestrial cellular infrastructure, particularly in remote, rural, and sparsely populated areas.","In this subsection, we present key metrics of Starlink’s DS2D RAN, namely RSRP, RSRQ and SINR. We examined the dataset for spatial patterns but","FIGURE 1. No. monthly unique ECI vs. No. operational satellites.","FIGURE 2. Spatio-temporal evolution of observed Starlink’s DS2D measurements from October 2024 to July 2025.","FIGURE 3. Starlink’s measurement counts vs. T-Mobile’s coverage. 1. Death Valley National Park, 2. Yellowstone National Park.","in Starlink’s DS2D network and T-Mobile terrestrial network. DS2D shows substantially lower and more homogeneous RSRP levels (median: -121 dBm vs. -97 dBm; interdecile range: 21 dB vs. 37 dB), reflecting larger propagation losses and uniform link geometry, as users are located at large but relatively similar distances from the base stations, predominantly with line-of-sight conditions. Despite limited bandwidth, RSRQ is more favorable in DS2D (median: -9 dB vs. -12 dB) owing to low network load and minimal interference, though this advantage may diminish as demand grows. The correlation between RSRP and RSRQ is stronger in DS2D (0.69 vs. 0.34), consistent with lower interference. SINR values are also lower in DS2D (median: 0 dB vs. 5 dB), underscoring its coverage-limited, low-load operation."]},{"title":"Performance Assessment of Future DS2D Services","level":2,"paragraphs":["Building on the previous observations, we evaluate the potential performance of future DS2D data services. For this, we apply the modified Shannon capacity formulation using the available bandwidth and SINR measurements of the last three months, to ensure that the results reflect a more stable operational state of the network. Based on the SINR distributions, the mean and median spectral efficiency values are 0.61 and 0.52 bps/Hz, respectively. Note that, given that high SINR values are rarely observed, this estimation is largely insensitive to the method used to compute $m$, and the influence of this parameter is negligible.","Since Starlink’s current DS2D operations are restricted to the PCS G Block $(2 \\times 5 \\mathrm{MHz})$, the derived spectral efficiency corresponds to an approximate downlink capacity of 3.1Mb/s per beam. This value should be regarded as an upperbound estimate of the average throughput per connection, corresponding to the scenario of a single user occupying the full bandwidth of the beam. While such speeds may be sufficient to provide basic connectivity in remote or underserved regions, they remain well below the average downlink rates offered by terrestrial networks. This gap highlights the complementary nature of DS2D services in their current phase, consistent with their role as an SCS solution.","Nevertheless, performance may improve in the coming months through several potential capacity expansion options, including:","1. Higher transmit power,","2. Reduced orbital altitude,","3. Expanded bandwidth, and","4. The continued growth of the satellite constellation.","First, as discussed earlier, we do not observe the 3.1-dB increase in the RAN metrics that would be expected from applying the FCC’s March 2025 authorization; instead, only a slight improvement is reflected in the mesurements. With the available evidence, it is not possible to determine whether this variation is attributable to the regulatory change. It therefore remains unclear whether transmissions are already occurring at the newly authorized power levels, although SpaceX’s filings suggest that this is the case (see footnote 4). Nevertheless, in the hypothetical assumption that the $9.4-\\mathrm{dB}$ relaxation in the OOBE limit allows for a future increase in transmit power, and assuming that the increase in SINR would be similar (cover-","FIGURE 6. CDF of physical-layer measurements for Starlink DSD and T-Mobile’s terrestrial networks.","age-limited network), we estimate that the spectral efficiency would increase from the current baseline to 0.89 bps/Hz (mean) and 0.83 bps/Hz (median), raising the estimated average per-beam capacity from $3.1 \\mathrm{Mb} / \\mathrm{s}$ to $4.5 \\mathrm{Mb} / \\mathrm{s}$.","Second, system performance may also be improved by lowering orbital altitudes. SpaceX has been authorized to selectively operate DS2D satellites in Very Low Earth Orbits (VLEO) at an altitude of 340-360 km, subject to previous coordination with NASA. ^{6}$ Assuming free-space propagation, relocating the entire constellation to lower altitudes would reduce path loss by $20 \\log _{10}(550 / 355) \\approx$ 3.8 dB . To comply with the OOBE constraints, this would require an estimated 1.3-dB reduction in transmit power, resulting in a net gain of about 2.5 dB in received signal power. Assuming again that the SINR values are increased in the same proportion, the spectral efficiency would raise from its baseline value to 0.83 bps/Hz (mean) and 0.76 bps/Hz (median). This corresponds to an approximate 1.4× gain, yielding an estimated downlink capacity of 4.2 Mb/s per beam.","Third, system throughput may be increased by expanding the available bandwidth. In September 2025, Starlink acquired spectrum from EchoStar in the MSS AWS-4 band (2000-2020 MHz uplink, 2180-2200 MHz downlink), and in the IMT PCS band (H Block, 1915-1920 MHz uplink, 1995-2000 MHz downlink), as discussed previously. This additional spectrum provides significantly more capacity than the $2 \\times 5 \\mathrm{MHz}$ PCS G Block currently used for DS2D.","Whereas the AWS-4 band has been standardized in 3GPP NTN as n252 and is expected to be integrated into smartphone chipsets in the future, the PCS H Block corresponds to existing IMT spectrum and can therefore be used immediately. Integrating the PCS H Block spectrum into the currently deployed infrastructure - which operates in the PCS G Block - would immediately double system capacity, increasing the per-beam estimate from 3.1 Mb/s to 6.2 Mb/s. In the medium term, once NTN bands are more widely supported in commercial devices, the additional 20 MHz downlink from AWS-4 could be exploited. Combined with the PCS allocations, this would increase per-beam capacity by a factor of six relative to the baseline, reaching about 18.6 Mb/s when using both Starlink’s spectrum holdings and T-Mobile’s PCS G Block.","Beyond the per-beam capacity expected, these acquisitions reduce Starlink’s reliance on third-party terrestrial operators for spectrum access. By leveraging their own PCS H Block spectrum, Starlink can provide a service comparable to that currently offered through T-Mobile’s spectrum, with the estimated per-beam throughput of 3.1 Mb/s. Furthermore, the aggregation of their full spectrum holdings in the AWS and PCS bands (totaling $2 \\times 25 \\mathrm{MHz}$ ) would enable an estimated per-beam throughput of $15.5 \\mathrm{Mb} / \\mathrm{s}$, thereby allowing the provision of DS2D services without reliance on third-party spectrum agreements. Note that these figures correspond to aggregate perbeam capacity rather than achievable single-user rates. Attaining the maximum values per connection would require device support for spectrum aggregation across these multiple bands, which is not yet included in current NTN standardization. Accordingly, the realistic upper bound for per-user capacity is expected to be around 12.4 Mb/s (estimated throughput over the AWS band only).","In the longer term, satellite swarm antenna arrays show promising preliminary results in increasing the directivity of satellite beams [15], which allows for higher gains and improved spatial multiplexing. Achieving this would require the launch and operation of many more satellites, which might also contribute to increasing the overall throughput of DS2D networks and the effective capacity experienced by end users. Although the FCC denied Starlink’s request to authorize 30,000 DS2D-capable satellites, the company remains authorized to operate up to 7,500 such satellites, indicating substantial potential for network densification. Furthermore, the aforementioned advancements in network capacity could be combined, potentially enabling greater per-beam throughput in the future."]},{"title":"Conclusions","level":2,"paragraphs":["In this article, we presented the first empirical analysis of a commercially deployed DS2D network, focusing on Starlink’s SCS Service in the U.S. in partnership with T-Mobile. Using largescale crowdsourced measurements between October 2024 and July 2025, we characterized the spatio-temporal evolution and RAN performance of the DS2D network, which only supported SMS during the observed period.","Our results confirm a strong correlation between the number of DS2D-capable satellites launched and the number of unique cell identifiers observed, as well as a spatial distribution of measurements consistent with the operator’s coverage gaps. We observe a significant number of measurements concentrated around areas that are relatively accessible yet underserved by terrestrial networks, such as national parks. Furthermore, we find significant negative correlation between the prevalence of Starlink measurements and population density, reflecting its role as a complementary solution in sparsely populated regions.","The measurements indicate slight increases in RSRP, RSRQ, and SINR throughout the beta test-","1ing period, which may be attributable to network changes, including the higher OOBE levels authorized by the FCC and the deployment of some satellites at VLEO altitudes. Based on the SINR measurements, we estimate the current average per-beam throughput to be approximately 3.1 Mb/s, which is sufficient for basic services but significantly below terrestrial averages. Looking ahead, per-beam throughput could increase to 4.2 Mb/s by using VLEO satellites (\\~350 km), and up to $4.5 \\mathrm{Mb} / \\mathrm{s}$ for LEO, assuming that OOBEs relaxation has not been applied yet. In the short term, recent spectrum acquisitions will enable doubling per-beam capacity (to $6.2 \\mathrm{Mb} / \\mathrm{s}$ ), with the potential to reach 18.6 Mb/s in the medium term once NTN bands are integrated into commercial smartphone modems. However, the extent to which these enhancements translate into higher per-user throughput will ultimately depend on the expansion of the satellite constellation and the evolution of service demand.","Our work illustrates the value of crowdsourced data to monitor emerging network technologies. Beyond characterizing deployment and performance, such data can help detect underserved zones, assess coverage gaps, and inform infrastructure planning, offering a promising tool for both technical and policy research on mobile communication systems. Future work will involve monitoring the evolution of DS2D networks and services, tracking the evolution of Starlink’s network as new services are introduced, and exploring other emerging DS2D deployments."]},{"title":"Acknowledgments","level":2,"paragraphs":["We would like to thank Dr. Tim Farrar for bringing one of the references to our attention, and Dr. Fadi Saibi for several corrections to an early version of the manuscript.","This work has been partially supported by Weplan Analytics through the CROWD-X project and by UPM’s Doctores Emergentes program (24-ED3B0Y-100-JOQZ29), funded by the Region of Madrid."]},{"title":"References","level":2,"paragraphs":["[1] N. Mohan et al., “A Multifaceted Look at Starlink Performance,” Proc. WWW’24, 2024, pp. 2723-34.[2] Y. Su et al., “Broadband LEO Satellite Communications: Architectures and Key Technologies,” IEEE Wireless Commun., vol. 26, no. 2, vol. 4,2019, pp. 55-61.[3] Starlink, “Direct to Cell: First Text Message Sent via Starlink Satellite,” https://www.starlink.com/public-files/DIRECT\\_TO\\_ CELL\\_FIRST\\_TEXT\\_UPDATE.pdf, 2024, accessed: May 2025.[4] S. Ma et al., “Network Characteristics of LEO Satellite Constellations: A Starlink-Based Measurement from End Users,” Proc. IEEE INFOCOM, 2023.[5] A. U. Chaudhry and H. Yanikomeroglu, “Laser Intersatellite Links in a Starlink Constellation: A Classification and Analysis,” IEEE Vehic. Tech. Mag., vol. 16, no. 2, vol. 6, 2021, pp. 48-56.[6] H. B. Pasandi et al., “A Survey on Direct-to-Device Satellite Communications: Advances, Challenges, and Prospects,” Proc. LEO Networking and Communication, 2024, pp. 7-12.[7] F. Michel et al., “A First Look at Starlink Performance,” Proc. IMC’22, 2022.[8] D. Laniewski, E. Lanfer, and N. Aschenbruck, “Measuring Mobile Starlink Performance: A Comprehensive Look,” IEEE Open J. Commun. Society, 2025.[9] D. Laniewski et al., “Starlink on the Road: A First Look at Mobile Starlink Performance in Central Europe,” Proc. TMA 2024, 2024.[10] Z. Frias, W. Lehr, and V. Stocker, “Building an Ecosystem for Mobile Broadband Measurement: Methods and Policy Challenges,” Telecommunications Policy, vol. 49, no. 5, vol. 6, 2025, p. 102905.[11] C. Johnson, Long Term Evolution in Bullets, 2nd ed., 2012.[12] J. Albert-Smet et al., “Starlink Direct-to-Cell Satellite Launches Per Date (from Official SpaceX Mission Reports),” 2025; https://dx.doi.org/10.21227/rknd-y219.[13] P. Mogensen et al., “LTE Capacity Compared to the Shannon Bound,” Vehic. Tech. Conf., Spring, 2007.[14] “Evolved Universal Terrestrial Radio Access (E-UTRA); Physical Layer Procedures (Release 17),” Third Generation Partnership Project, Technical Specification 3GPP TS 36.213 v17.1.0, May 2022.[15] D. Tuzi, T. Delamotte, and A. Knopp, “Satellite SwarmBased Antenna Arrays for 6G Direct-to-Cell Connectivity,” IEEE Access, vol. 11, 2023."]},{"title":"Biographies","level":2,"paragraphs":["Jorge Garcia-Cabeza (jorge.garcia@weplananalytics.com) is an Industrial Ph.D. candidate at Univ. Politécnica de Madrid (UPM) and Weplan Analytics. He holds MSc. degrees in Telecommunications Engineering and Data Science from UPM. His research focuses on network measurements to characterize wireless technologies and spectrum utilization using crowdsourced data as a diagnostic tool.","Javier Albert-Smet (javier.albert.smet@upm.es) is a Ph.D. candidate at UPM focusing on mobile network measurements. He holds an MSc. in Electrical Engineering from KTH, where he graduated with honors in 2022. His main research interests are AI & mobile network optimization, a field in which he co-authored two patents at Ericsson.","Zoraida Frias (zoraida.frias@upm.es) is an Associate Professor at UPM, where she earned her Ph.D. in Communications Technologies in 2016 (cum laude). Her work bridges engineering and policy, focusing on data-driven models for analyzing next-generation network deployments and their economic and regulatory dimensions, with a particular emphasis on spectrum.","Luis Mendo (luis.mendo@upm.es) is an Associate Professor at UPM. He received the Ph.D. degree (cum laude) in Telecommunication Engineering from UPM in 2001. He has coauthored four books, four patents, and over 40 papers in the area of mobile communications. His research interests include analysis and optimization of mobile networks, simulation methods, and statistical estimation.","Santiago Andrés Azcoitia (santiago.andres@upm.es) is an Assistant Professor at UPM. He received the Ph.D. in Telematics Engineering from Univ. Carlos III de Madrid in 2023 (cum laude), and worked for 25 years as an ICT strategy consultant. His research interests include telecommunication networks, digital economics, policy, regulations, and ethics.","Eduardo Yraola (eduardo.yraola@weplananalytics.com) is the Lead Data Scientist of Weplan Analytics. He received his Ph.D. in physics from Univ. Autónoma de Madrid in 2015, and has over 10 years of experience as a data scientist.","1. ^{6}$ See FCC’s DA 24-1193."]}];const translations={"Starlink has reshaped the satellite telecommunication sector by deploying over 7,000 satellites since its first launches in 2019.":"自2019年首次發射以來，Starlink已部署超過7,000顆衛星，重塑衛星通訊產業。","The bent-pipe architecture initially adopted [4] enabled rapid deployment using simpler satellite designs at the cost of deploying a dense network of ground stations to ensure continuous coverage.":"最初採用的透明轉發架構[4]，透過較簡單的衛星設計實現快速部署，但代價是必須建立密集的地面站網路以維持連續覆蓋。","From 2022 onward, Starlink progressively introduced laser inter-satellite links (ISL), fully adopted in its second-generation (“Gen2”) fleet, enabling onboard signal processing and space-based routing.":"自2022年起，Starlink逐步導入衛星間雷射鏈路（ISL），並在第二代（Gen2）衛星群全面採用，使衛星能進行星上訊號處理與太空路由。","This transition from a ground-dependent relay to a space-based mesh brings expanded coverage, improved resilience, and enhanced end-to-end performance [1].":"這項從依賴地面站的中繼架構轉向太空網狀網路的變革，擴大了覆蓋範圍、提升網路韌性，並改善端到端效能[1]。"};const vocab=[["reshape","重塑"],["telecommunication","電信通訊"],["deployment","部署"],["architecture","架構"],["resilience","韌性"],["relay","中繼"],["constellation","衛星星座"],["spectrum","頻譜"],["interference","干擾"],["throughput","吞吐量"],["crowdsourced","群眾協作蒐集的"],["spectral efficiency","頻譜效率"],["downlink","下行鏈路"],["uplink","上行鏈路"]];
const chap=document.querySelector('#chap'),content=document.querySelector('#content');let done=new Set(JSON.parse(localStorage.getItem('paperDone')||'[]'));let voices=[];
function split(s){return s.match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g)?.map(x=>x.trim()).filter(Boolean)||[s]}
const all=sections.flatMap((s,i)=>s.paragraphs.flatMap((p,j)=>split(p).map((v,k)=>({id:i+'-'+j+'-'+k,text:v}))));
sections.forEach((s,i)=>chap.add(new Option(s.title,i)));const initial=Number(localStorage.getItem('paperSection')||0);chap.value=Math.min(initial,sections.length-1);
function updateProgress(){document.querySelector('#progress').value=100*done.size/Math.max(1,all.length);document.querySelector('#progressText').textContent=done.size+' / '+all.length+' 句已讀'}
function speak(text,el){speechSynthesis.cancel();document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number(document.querySelector('#rate').value);u.voice=speechSynthesis.getVoices().find(v=>v.lang==='en-US')||null;u.onstart=()=>el.classList.add('playing');u.onend=()=>el.classList.remove('playing');speechSynthesis.speak(u)}
function render(){let i=Number(chap.value);localStorage.setItem('paperSection',i);content.replaceChildren();let section=sections[i];let title=document.createElement('h2');title.textContent=section.title;content.append(title);section.paragraphs.forEach((p,j)=>{const card=document.createElement('div');card.className='card';split(p).forEach((sentence,k)=>{let id=i+'-'+j+'-'+k;let row=document.createElement('div');row.className='sentence';let text=document.createElement('p');text.textContent=sentence;let actions=document.createElement('div');actions.className='actions';let play=document.createElement('button');play.textContent='▶ 朗讀';play.onclick=()=>speak(sentence,row);actions.append(play);let trans=translations[sentence];let reveal=document.createElement('button');reveal.className='secondary';reveal.textContent='翻譯';let translation=document.createElement('div');translation.className='translation';translation.hidden=true;translation.textContent=trans||'此句繁體中文翻譯尚未完成';reveal.onclick=()=>{translation.hidden=!translation.hidden};actions.append(reveal);let mark=document.createElement('button');mark.className='secondary';function sync(){mark.textContent=done.has(id)?'✓ 已讀':'○ 標記已讀'}sync();mark.onclick=()=>{done.has(id)?done.delete(id):done.add(id);localStorage.setItem('paperDone',JSON.stringify([...done]));sync();updateProgress()};actions.append(mark);row.append(text,actions,translation);card.append(row)});content.append(card)});updateProgress()}
chap.onchange=render;vocab.forEach(([a,b])=>{let r=document.querySelector('#words').insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b});render();
</script></body></html>
